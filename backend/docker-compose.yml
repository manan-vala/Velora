# Local development stack. Production runs from the velora-vm-hub compose file instead.
# OSRM is not included: point OSRM_URL (in .env) at a running osrm-routed.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: velora
      POSTGRES_PASSWORD: velora
      POSTGRES_DB: velora
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velora -d velora"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://velora:velora@db:5432/velora
      OSRM_URL: ${OSRM_URL:?set OSRM_URL in .env}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-admin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?set SUPERADMIN_PASSWORD in .env}
      SOLVER_MAX_WORKERS: ${SOLVER_MAX_WORKERS:-1}

volumes:
  postgres_data:
